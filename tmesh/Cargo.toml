[package]
name = "tmesh"
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
minimeshb.workspace = true
nalgebra.workspace = true
rand.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
kdtree = { version = "0.8" }
parry3d-f64 = { version = "0.30.2" }
parry2d-f64 = { version = "0.30.2" }
metis = { git = "https://github.com/tucanos/metis-rs.git", rev = "d31aa3e", optional=true}
lindel = "0.1.1"
stl_io = "0.11.0"
env_logger = "0.11.11"
argmin = { git = "https://github.com/tucanos/argmin.git", tag = "tucanos-0.4.0", optional=true }
argmin-math = { git = "https://github.com/tucanos/argmin.git", tag = "tucanos-0.4.0", features = ["nalgebra_latest",], optional=true }
argmin-observer-slog = {version = "0.2.0", optional=true}
libm.workspace = true
tucanos-vtkio = { path = "../tucanos-vtkio" }

[features]
32bit-tags = []
64bit-tags = []
argmin = ["dep:argmin", "dep:argmin-math", "dep:argmin-observer-slog"]

[lints]
workspace = true

[[example]]
name = "dual_mesh_2d"

[[example]]
name = "partition_3d"

[[example]]
name = "dual_mesh_3d"
