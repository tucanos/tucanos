[package]
name = "tucanos"
version.workspace = true
edition.workspace = true
links = "tucanos"

[dependencies]
nalgebra = { workspace = true, features = ["rand"] }
log.workspace = true
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
rustc-hash.workspace = true
sorted-vec = "0.8.10"
rand.workspace = true
rayon.workspace = true
typenum = { version ="1.20.1", features = ["const-generics"] }
num = "0.4.3"
tmesh = {path = "../tmesh"}
libm.workspace = true
ferreus_rbf = "0.3.0"
faer = "0.24.4"

[features]
32bit-tags = ["tmesh/32bit-tags"]
64bit-tags = ["tmesh/64bit-tags"]
metis = ["tmesh/metis"]
coupe = ["tmesh/coupe"]

trace_edges = []

[[example]]
name = "adapt_ellipse"

[[example]]
name = "cube_cylinder"

[lints]
workspace = true
