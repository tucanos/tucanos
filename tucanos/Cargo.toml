[package]
name = "tucanos"
version.workspace = true
edition.workspace = true
links = "tucanos"

[dependencies]
nalgebra = { workspace = true, features = ["rand"] }
log.workspace = true
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
rustc-hash.workspace = true
sorted-vec = "0.8.11"
rand.workspace = true
rayon.workspace = true
typenum = { version ="1.20.1", features = ["const-generics"] }
num = "0.4.3"
tmesh = {path = "../tmesh"}
libm.workspace = true
clap = { version = "4.5", features = ["derive"] }

[features]
32bit-tags = ["tmesh/32bit-tags"]
64bit-tags = ["tmesh/64bit-tags"]
kahip = ["tmesh/kahip"]
metis = ["tmesh/metis"]
argmin = ["tmesh/argmin"]

trace_edges = []

[[example]]
name = "adapt_ellipse"

[[example]]
name = "cube_cylinder"

[[bin]]
name = "estimate_work"
required-features = ["kahip", "metis"]

[[bin]]
name = "parallel"
required-features = ["kahip", "metis"]

[lints]
workspace = true
